<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}ANIMA</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1830;
      --bg-alt: #111931;
      --card: rgba(23, 33, 59, 0.55);
      --stroke: rgba(167, 190, 248, 0.16);
      --text: #F4F7FF;
      --text-2: #B3C6EF;
      --text-3: #9DABCD;
      --muted: #6D7FAF;
      --accent: #A7BEF8;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(ellipse 120% 60% at 50% -10%, #1B2A52 0%, rgba(15, 24, 48, 0) 70%);
      background-attachment: fixed;
      color: var(--text-2);
      font: 16px/1.7 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: var(--text); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header.site {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 28px 0 8px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .brand span {
      font-family: "Cormorant Infant", Georgia, serif; font-weight: 600;
      font-size: 22px; letter-spacing: 0.32em; color: var(--text);
    }
    nav.site { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
    nav.site a { color: var(--text-3); text-decoration: none; }
    nav.site a:hover, nav.site a[aria-current="page"] { color: var(--text); }
    main { padding: 32px 0 48px; }
    .doc {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 36px 40px;
    }
    h1, h2, h3 { font-family: "Cormorant Infant", Georgia, serif; color: var(--text); font-weight: 600; line-height: 1.2; }
    h1 { font-size: 40px; margin: 0 0 8px; }
    h2 { font-size: 26px; margin: 40px 0 10px; }
    h3 { font-size: 20px; margin: 28px 0 6px; }
    strong { color: var(--text); font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--stroke); margin: 32px 0; }
    ul, ol { padding-left: 22px; }
    li { margin: 4px 0; }
    code { background: rgba(167, 190, 248, 0.1); padding: 1px 6px; border-radius: 6px; font-size: 0.9em; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 16px 0; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
    th { color: var(--text); font-weight: 600; }
    .note {
      border-left: 3px solid var(--accent); background: rgba(167, 190, 248, 0.07);
      padding: 12px 16px; border-radius: 0 12px 12px 0; margin: 20px 0;
    }
    footer.site { border-top: 1px solid var(--stroke); padding: 24px 0 40px; font-size: 14px; color: var(--muted); }
    footer.site a { color: var(--text-3); }
    @media (max-width: 640px) {
      header.site { flex-direction: column; align-items: flex-start; }
      .doc { padding: 24px 20px; border-radius: 16px; }
      h1 { font-size: 32px; }
      h2 { font-size: 23px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="/"><img src="/assets/icon.png" alt=""><span>ANIMA</span></a>
      <nav class="site" aria-label="Site">
        <a href="/privacy/" {% if page.url == "/privacy/" %}aria-current="page"{% endif %}>Privacy</a>
        <a href="/terms/" {% if page.url == "/terms/" %}aria-current="page"{% endif %}>Terms</a>
        <a href="/delete-account/" {% if page.url == "/delete-account/" %}aria-current="page"{% endif %}>Delete account</a>
        <a href="/support/" {% if page.url == "/support/" %}aria-current="page"{% endif %}>Support</a>
      </nav>
    </header>
    <main>
      {% if page.bare %}{{ content }}{% else %}<article class="doc">{{ content }}</article>{% endif %}
    </main>
    <footer class="site">
      © {{ site.time | date: "%Y" }} JNT &amp; Co · <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </footer>
  </div>
</body>
</html>
